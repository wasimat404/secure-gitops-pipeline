name: CI — build, scan, sign, deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'      # avoid loops when the workflow itself bumps the tag
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Default to least privilege; jobs opt in to more.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build the image to a local tarball so we can scan it BEFORE pushing.
  #    A vulnerable image should never land in the registry.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build image
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      short-sha: ${{ steps.meta.outputs.short-sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute metadata
        id: meta
        run: echo "short-sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build (load to local docker, do not push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short-sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Save image as artifact for downstream jobs
        run: |
          docker save "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short-sha }}" \
            -o /tmp/image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: /tmp/image.tar
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Trivy gate. Fails the pipeline on HIGH/CRITICAL.
  # ──────────────────────────────────────────────────────────────────────────
  scan:
    name: Trivy scan (gate)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-tar
          path: /tmp

      - name: Load image into Docker
        run: docker load -i /tmp/image.tar

      - name: Trivy → SARIF (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy → gate (fails build on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/image.tar
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'
          trivyignores: '.trivyignore'

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Push + sign + SBOM. Only runs on main, only after scan passes.
  # ──────────────────────────────────────────────────────────────────────────
  publish:
    name: Push, sign, SBOM
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image-ref: ${{ steps.push.outputs.image-ref }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.short-sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

      - name: Set image-ref output
        run: |
          echo "image-ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM as attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Bump the image tag in k8s/ and commit. ArgoCD picks it up from there.
  # ──────────────────────────────────────────────────────────────────────────
  bump-manifest:
    name: Bump manifest tag
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update kustomization image tag
        run: |
          cd k8s
          kustomize edit set image \
            app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.short-sha }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest change, skipping commit."
            exit 0
          fi
          git commit -m "chore: bump app image to ${{ needs.build.outputs.short-sha }} [skip ci]"
          git push
