# ─────────────────────────────────────────────────────────────────────────────
# Tells External Secrets Operator how to talk to Vault.
# Auth uses the in-cluster ServiceAccount + Vault's kubernetes auth method.
# No Vault token is stored in K8s.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: secure-app
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"   # adjust per environment
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "secure-app"                  # matches vault/k8s-auth-setup.sh
          serviceAccountRef:
            name: secure-app
---
# ─────────────────────────────────────────────────────────────────────────────
# Pulls vault://secret/secure-app/db into a Kubernetes Secret named
# `app-db-credentials`. The Deployment references that Secret by name,
# so the manifest never sees credential values.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-credentials
  namespace: secure-app
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: app-db-credentials   # the K8s Secret that gets created
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secure-app/db
        property: username
    - secretKey: password
      remoteRef:
        key: secure-app/db
        property: password
